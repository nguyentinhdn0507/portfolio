name: CI/CD Pipeline - Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. CI: Quality & Code Analysis Gate
  # ==========================================
  ci-quality:
    name: 🔍 CI - Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🛡️ Run ESLint code quality check
        run: npm run lint

      - name: 📐 Run TypeScript strict typecheck
        run: npm run typecheck

  # ==========================================
  # 2. CI: Production Build & Static Export
  # ==========================================
  build-and-export:
    name: 🏗️ Build Static Site
    runs-on: ubuntu-latest
    needs: [ci-quality]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🚀 Build static export with Next.js
        run: npm run build

      - name: 📄 Disable Jekyll for Next.js assets
        run: touch ./out/.nojekyll

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  # ==========================================
  # 3. CD: Automated Deployment to GitHub Pages
  # ==========================================
  deploy:
    name: 🌐 CD - Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-and-export]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
